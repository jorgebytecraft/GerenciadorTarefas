<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Gerenciador de Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css"> 
</head>
  <body class="area-page">

    <header>
        <div class="container-fluid p-3 text-center">
            <h1 class="display-1">To Do List</h1>                
        </div>
    </header>

    <aside>
        <div class="container">
                <div class="card-body m-3">
                    <h5>Lista de Tarefa</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Levanta Cedo</li>
                        <li class="list-group-item">Malhar </li>
                        <li class="list-group-item">Estudar</li>   
                    </ul>
                </div>
            </div>
                <div class="card-body m-3">
                    <h5>Lista Concluida</h5>
                    <ol class="list-group list-group-numbered">
                        <li class="list-group-item">Ler</li>   
                    </ol>
                </div>
            </div>            
    </aside>

    <main>
        <div class="container">
            <div class="card-body d-flex flex-column gap-3 m-3">
                <input class="form-control" type="text" placeholder="Nova tarefa">
                    <button class="btn btn-primary">Adicionar</button>
            </div>            
            <div class="card-body d-flex flex-column gap-3 m-3">
                <input class="form-control" type="text" placeholder="Tarefa">
                    <button class="btn btn-danger">Remover</button>
            </div>
            <div class="card-body d-flex flex-column gap-3 m-3">
                <input class="form-control" type="text" placeholder="Tarefa">
                    <button class="btn btn-success">Finalizada</button>
            </div>            
        </div>    
    </main>

    <footer>
        <div class="container">
            <div class="card-footer m-3 p-3">
                <h5 class="card-title">Gerenciador de Tarefa</h5>
                <p class="card-text">Desenvolvido pelo Jorge Borges</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>  
</html>
